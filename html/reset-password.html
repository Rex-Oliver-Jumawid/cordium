<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cordium | Set Password</title>
  <link rel="stylesheet" href="../css/login.css">
  <style>
    .reset-panel{max-width:420px;margin:8vh auto;padding:28px;border:1px solid #ddd;border-radius:12px;background:white}
    .reset-panel input,.reset-panel button{width:100%;box-sizing:border-box;margin:12px 0;padding:12px}
    .reset-panel button{cursor:pointer}
    #message{min-height:24px}
  </style>
</head>
<body>
<main class="reset-panel">
  <img src="../images/logo.svg" alt="Cordium" style="width:90px">
  <h1>Set your Cordium password</h1>
  <p id="message" role="status">Verifying your invitation...</p>
  <form id="resetForm" hidden>
    <label for="password">New password (12 characters minimum)</label>
    <input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
    <label for="confirm">Confirm new password</label>
    <input id="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
    <button type="submit">Set password</button>
  </form>
  <p><a href="/html/login.html">Return to login</a></p>
</main>
<script>
"use strict";
let accessToken = null;
let refreshToken = null;
const message = document.getElementById("message");
const form = document.getElementById("resetForm");

async function init() {
  const url = new URL(location.href);
  const fragment = new URLSearchParams(url.hash.substring(1));
  accessToken = fragment.get("access_token");
  refreshToken = fragment.get("refresh_token");
  // Remove tokens from browser history as soon as they have been read.
  history.replaceState(null, "", "/html/reset-password.html");
  if (!accessToken || !refreshToken) {
    const tokenHash = url.searchParams.get("token_hash");
    const type = url.searchParams.get("type");
    if (tokenHash && ["invite", "recovery"].includes(type)) {
      const response = await fetch("/api/auth/verify-link", {
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({tokenHash,type}),
      });
      const data = await response.json();
      if (!response.ok || !data.success) throw new Error(data.message || "Link expired");
      accessToken = data.accessToken;
      refreshToken = data.refreshToken;
    }
  }
  if (!accessToken || !refreshToken) throw new Error("Link invalid or expired. Request a new invitation.");
  message.textContent = "Choose a new password.";
  form.hidden = false;
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;
  if (password !== confirm) {
    message.textContent = "Passwords do not match.";
    return;
  }
  const button = form.querySelector("button");
  button.disabled = true;
  try {
    const response = await fetch("/api/auth/set-password", {
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({accessToken,refreshToken,password}),
    });
    const data = await response.json();
    if (!response.ok || !data.success) throw new Error(data.message || "Unable to update password.");
    accessToken = null;
    refreshToken = null;
    form.reset();
    form.hidden = true;
    message.textContent = "Password saved. You can now sign in.";
  } catch(error) {
    message.textContent = error.message;
  } finally {
    button.disabled = false;
  }
});
init().catch((error) => { message.textContent = error.message; });
</script>
</body>
</html>
